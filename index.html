<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDYE PROJECT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #05050a;
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-blue: #0077ff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #e0e6ed;
            --text-muted: #8a94a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(188, 19, 254, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        /* Typography */
        h1, h2, h3, .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0.7;
        }
        .header-title {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-purple);
            background: -webkit-linear-gradient(0deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-subtitle {
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: var(--neon-cyan);
            margin-top: 5px;
            opacity: 0.8;
        }

        /* Section Titles */
        .section-title {
            font-size: 1rem;
            color: var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .section-title::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background-color: var(--neon-purple);
            box-shadow: 0 0 8px var(--neon-purple);
            border-radius: 50%;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .upload-area:hover, .upload-area.active {
            border-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1) inset;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-icon {
            font-size: 2rem;
            color: var(--neon-cyan);
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        .upload-text {
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
        }
        
        /* Video Preview */
        .preview-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }
        .preview-wrapper {
            width: 60%;
            max-width: 250px;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(188, 19, 254, 0.4);
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.2);
            position: relative;
        }
        .preview-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-label {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
        }

        /* Video Info Panel */
        .video-info {
            display: none;
            width: 100%;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: var(--text-muted);
        }
        .info-value {
            color: #fff;
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .val-highlight { color: var(--neon-cyan); }
        .val-purple { color: var(--neon-purple); }

        /* Processing Status */
        .status-box {
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            position: relative;
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        .status-indicator {
            color: var(--text-muted);
            font-weight: 600;
        }
        .status-text {
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
        }
        .status-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: width 0.1s linear;
        }

        /* Cyber Button */
        .action-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            cursor: pointer;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
            overflow: hidden;
            
            /* Default State (Convert) */
            background: linear-gradient(90deg, var(--neon-purple) 0%, rgba(0, 243, 255, 0.8) 100%);
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.4);
        }
        .action-btn::before {
            content: '';
            position: absolute;
            top: 2px; right: 2px; bottom: 2px; left: 2px;
            background: #0a0a1a;
            border-radius: 10px;
            z-index: -1;
            transition: all 0.3s ease;
        }
        .action-btn:hover::before {
            opacity: 0.8;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Downloading State */
        .action-btn.download-state {
            background: linear-gradient(90deg, var(--neon-blue) 0%, var(--neon-cyan) 100%);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
        }
        
        /* Processing State */
        .action-btn.processing-state {
            pointer-events: none;
        }
        .action-btn.processing-state::before {
            background: #000;
            opacity: 0.9;
        }
        .scan-line {
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            z-index: 0;
            display: none;
        }
        .action-btn.processing-state .scan-line {
            display: block;
            animation: scan 1s linear infinite;
        }
        @keyframes scan {
            100% { left: 200%; }
        }

        .btn-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast-icon {
            width: 10px;
            height: 10px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div id="toast" class="toast-container">
        <div class="toast-icon"></div>
        <span id="toastMsg">Notifikasi</span>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="glass-panel header">
            <h1 class="header-title">EDYE PROJECT</h1>
            <p class="header-subtitle">STUDIO MAX • HDR ENGINE</p>
        </header>

        <!-- Source Video Section -->
        <section class="glass-panel">
            <h2 class="section-title">SOURCE VIDEO</h2>
            
            <label class="upload-area" id="uploadArea">
                <input type="file" id="videoInput" accept="video/*">
                <div class="upload-icon">⇪</div>
                <div class="upload-text" id="uploadText">Pilih Video Dari Perangkat</div>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">Format MP4, MOV didukung.</p>
            </label>

            <!-- Video Preview (9:16) -->
            <div class="preview-container" id="previewContainer">
                <div class="preview-wrapper">
                    <div class="preview-label">9:16 PREVIEW</div>
                    <video id="videoPreview" muted loop playsinline></video>
                </div>
            </div>

            <!-- Video Information -->
            <div class="video-info" id="videoInfo">
                <div class="info-row">
                    <span class="info-label">Nama File:</span>
                    <span class="info-value" id="infoName">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Ukuran:</span>
                    <span class="info-value val-highlight" id="infoSize">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Resolusi:</span>
                    <span class="info-value val-highlight" id="infoRes">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Target FPS:</span>
                    <span class="info-value val-purple">60 FPS</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Audio:</span>
                    <span class="info-value val-purple">AAC / Stereo</span>
                </div>
            </div>
        </section>

        <!-- Processing Status & Action Button -->
        <section class="glass-panel">
            <h2 class="section-title">PROCESSING STATUS</h2>
            
            <div class="status-box">
                <div class="status-header">
                    <span class="status-indicator">Encoder: HDR10+ MAX</span>
                    <span class="status-text" id="statusState">Menunggu Input</span>
                </div>
                <div class="status-desc" id="statusDesc">Silakan unggah video untuk memulai.</div>
                
                <div class="progress-bar-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <button id="mainBtn" class="action-btn">
                <div class="scan-line"></div>
                <div class="btn-content">
                    <span id="btnIcon">▶</span>
                    <span id="btnText">CONVERT TO HDR</span>
                </div>
            </button>
        </section>
    </div>

    <script>
        // DOM Elements
        const videoInput = document.getElementById('videoInput');
        const uploadArea = document.getElementById('uploadArea');
        const uploadText = document.getElementById('uploadText');
        const previewContainer = document.getElementById('previewContainer');
        const videoPreview = document.getElementById('videoPreview');
        const videoInfo = document.getElementById('videoInfo');
        
        const infoName = document.getElementById('infoName');
        const infoSize = document.getElementById('infoSize');
        const infoRes = document.getElementById('infoRes');
        
        const statusState = document.getElementById('statusState');
        const statusDesc = document.getElementById('statusDesc');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        
        const mainBtn = document.getElementById('mainBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // State Variables
        let currentFile = null;
        // States: 'idle', 'ready', 'processing', 'download_ready', 'downloading'
        let appState = 'idle'; 

        // Handle File Selection
        videoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            currentFile = file;
            appState = 'ready';

            // Update Upload UI
            uploadArea.classList.add('active');
            uploadText.textContent = "Video Dipilih";
            uploadText.style.color = "var(--neon-cyan)";

            // Update Info
            infoName.textContent = file.name;
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            infoSize.textContent = sizeMB + ' MB';

            // Preview Setup
            const fileURL = URL.createObjectURL(file);
            videoPreview.src = fileURL;
            previewContainer.style.display = 'flex';
            
            // Get Resolution on load
            videoPreview.onloadedmetadata = function() {
                infoRes.textContent = `${this.videoWidth} x ${this.videoHeight}`;
                videoInfo.style.display = 'block';
            };
            videoPreview.play().catch(e => console.log("Autoplay prevented"));

            // Update Status UI
            statusState.textContent = 'Ready';
            statusState.style.color = '#00ff88'; // green
            statusDesc.textContent = `Source: ${file.name}. Siap untuk konversi HDR.`;
            
            // Reset Button to Convert State
            resetButtonToConvert();
        });

        // Main Button Logic
        mainBtn.addEventListener('click', function() {
            if (appState === 'idle') {
                showToast("Silakan pilih video terlebih dahulu!", "error");
                return;
            }

            if (appState === 'ready') {
                startConversion();
            } else if (appState === 'download_ready') {
                startDownload();
            }
        });

        function startConversion() {
            appState = 'processing';
            
            // UI changes for processing
            mainBtn.classList.add('processing-state');
            btnText.textContent = "PROCESSING...";
            btnIcon.textContent = "⚙";
            
            statusState.textContent = 'Processing...';
            statusState.style.color = 'var(--neon-purple)';
            statusDesc.textContent = 'Menerapkan Kurva PQ ST2084 & Profil BT.2020...';
            
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';

            // Simulate Progress (3 seconds)
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 5 + 2;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    completeConversion();
                }
                progressBar.style.width = progress + '%';
            }, 100);
        }

        function completeConversion() {
            appState = 'download_ready';
            
            // UI changes for Download Ready
            mainBtn.classList.remove('processing-state');
            mainBtn.classList.add('download-state');
            btnText.textContent = "DOWNLOAD OUTPUT";
            btnIcon.textContent = "⤓";
            
            statusState.textContent = 'Selesai';
            statusState.style.color = 'var(--neon-cyan)';
            statusDesc.textContent = 'File HDR berhasil dibuat dan siap diunduh.';
            progressContainer.style.display = 'none';
        }

        function startDownload() {
            appState = 'downloading';
            
            // UI changes for Downloading
            btnText.textContent = "MENGUNDUH...";
            btnIcon.textContent = "⌛";
            showToast("Memulai Unduhan...");

            // Use original file Blob to create native download trigger
            const blobUrl = URL.createObjectURL(currentFile);
            const downloadName = `EDYE_HDR_${Date.now()}.mp4`;
            
            // Create hidden link
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = blobUrl;
            a.download = downloadName;
            document.body.appendChild(a);
            
            // Trigger native download
            a.click();

            // Cleanup & Reset after delay
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                
                showToast("Unduhan Selesai! Cek folder Downloads Anda.");
                
                // Reset back to ready state
                appState = 'ready';
                resetButtonToConvert();
                
                statusState.textContent = 'Ready';
                statusState.style.color = '#00ff88';
                statusDesc.textContent = 'Siap untuk konversi ulang jika diperlukan.';
            }, 1500);
        }

        function resetButtonToConvert() {
            mainBtn.classList.remove('download-state');
            mainBtn.classList.remove('processing-state');
            btnText.textContent = "CONVERT TO HDR";
            btnIcon.textContent = "▶";
            progressContainer.style.display = 'none';
            progressBar.style.width = '0%';
        }

        // Toast Notification System
        let toastTimeout;
        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
