<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HDR+ Dolby Vision Web App</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #07090e; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        h1 { font-size: 1.25rem; text-align: center; font-weight: 600; color: #38bdf8; }
        .player-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.1); }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        video { display: none; } /* Video asli disembunyikan, diproses via canvas */
        
        .controls { background: #111827; padding: 16px; border-radius: 12px; border: 1px solid #1f2937; display: flex; flex-direction: column; gap: 12px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { font-size: 0.85rem; color: #94a3b8; display: flex; justify-content: space-between; }
        input[type="range"] { width: 100%; accent-color: #38bdf8; }
        
        .btn { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; text-align: center; transition: background 0.2s; }
        .btn:active { background: #0369a1; }
        .btn-file { background: #1e293b; border: 1px dashed #475569; }
        
        .badge { display: inline-block; background: rgba(56, 189, 248, 0.1); color: #38bdf8; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.2); }
    </style>
</head>
<body>

<div class="container">
    <h1>HDR+ Dolby Vision Web<br><span class="badge">PWA Ready Edition</span></h1>

    <div class="player-box">
        <video id="videoSource" playsinline crossorigin="anonymous"></video>
        <canvas id="outputCanvas"></canvas>
    </div>

    <div class="controls">
        <label class="btn btn-file">
            📁 Pilih Video dari HP
            <input type="file" id="fileInput" accept="video/*" style="display: none;">
        </label>

        <div class="control-group">
            <label><span>Peak Brightness (HDR Boost)</span><span id="valBrightness">1.3x</span></label>
            <input type="range" id="brightness" min="1.0" max="2.0" step="0.05" value="1.3">
        </div>

        <div class="control-group">
            <label><span>Color Saturation (Dolby Vivid)</span><span id="valSat">1.4x</span></label>
            <input type="range" id="saturation" min="1.0" max="2.0" step="0.05" value="1.4">
        </div>

        <div class="control-group">
            <label><span>Contrast (Dynamic Range)</span><span id="valContrast">1.25x</span></label>
            <input type="range" id="contrast" min="1.0" max="1.8" step="0.05" value="1.25">
        </div>

        <button class="btn" id="playBtn" disabled>▶ Putar & Terapkan Efek HDR</button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const video = document.getElementById('videoSource');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');

    const rngBrightness = document.getElementById('brightness');
    const rngSat = document.getElementById('saturation');
    const rngContrast = document.getElementById('contrast');

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            video.src = url;
            video.load();
            playBtn.disabled = false;
            playBtn.innerText = "▶ Mulai Putar Video";
        }
    });

    playBtn.addEventListener('click', () => {
        if (video.paused) {
            video.play();
            playBtn.innerText = "⏸ Jeda";
            requestAnimationFrame(renderFrame);
        } else {
            video.pause();
            playBtn.innerText = "▶ Lanjutkan";
        }
    });

    function renderFrame() {
        if (video.paused || video.ended) return;
        
        // Ukuran canvas menyesuaikan video
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Menerapkan simulasi filter HDR / Dolby Vision (Contrast, Brightness, Saturasi tinggi)
        ctx.filter = `
            brightness(${rngBrightness.value}) 
            contrast(${rngContrast.value}) 
            saturate(${rngSat.value})
        `;
        
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Update label angka
        document.getElementById('valBrightness').innerText = rngBrightness.value + 'x';
        document.getElementById('valSat').innerText = rngSat.value + 'x';
        document.getElementById('valContrast').innerText = rngContrast.value + 'x';

        requestAnimationFrame(renderFrame);
    }

    video.addEventListener('play', () => {
        requestAnimationFrame(renderFrame);
    });
</script>
</body>
</html>
